[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-adaptive-ensemble-engine"
version = "0.1.0"
description = "Point-in-time, research-only mixture-of-experts forecasting engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.scripts]
regime-ensemble = "regime_ensemble.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
